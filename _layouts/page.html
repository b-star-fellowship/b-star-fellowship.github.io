---
layout: base
---
<div class="page-shell container">
  <a class="back-link" href="{{ '/' | relative_url }}">{% include arrow.html direction="back" %} Back to the studio</a>
  <article class="prose">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="article-lede">{{ page.description }}</p>{% endif %}
    {{ content }}
  </article>
</div>
