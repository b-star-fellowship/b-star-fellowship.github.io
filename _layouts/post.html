---
layout: base
---
<div class="page-shell container">
  <a class="back-link" href="{{ '/blog/' | relative_url }}">{% include arrow.html direction="back" %} All studio notes</a>
  <article class="prose">
    <p class="eyebrow">{{ page.category | default: 'Studio notes' }} <span class="meta-divider">/</span> <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>
    <h1>{{ page.title }}</h1>
    {% if page.author %}<p class="byline">By {{ page.author }}</p>{% endif %}
    {{ content }}
  </article>
</div>
