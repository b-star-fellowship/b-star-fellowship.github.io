  bio:
    - Sam studied computer science and music at Brown and joined Down Dog in 2017 as its first employee. His work has included the web app, workout music generation, and support for multiple languages as the company grew to reach millions of users.
    - He started the fellowship to help Brown students try building their own software products. In weekly conversations, Sam shares practical lessons from Down Dog and helps fellows think through product decisions, user feedback, and the next step toward launch.
